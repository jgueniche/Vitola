name: Database

on:
  pull_request:
    paths: ['supabase/**', 'docs/phase-0/*.sql', '.github/workflows/db.yml']
  push:
    branches: ['**']
    paths: ['supabase/**', 'docs/phase-0/*.sql', '.github/workflows/db.yml']

jobs:
  migrations:
    name: apply migrations · RLS coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitola
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vitola

    steps:
      - uses: actions/checkout@v5

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # The Phase 0 verification file creates its own Supabase stand-ins
      # (auth.users, auth.uid(), storage.*, the anon/authenticated roles),
      # applies the P1 migration and runs 25 behavioural assertions.
      #
      # `SET LOCAL ROLE` outside a transaction is ignored with a WARNING, not an
      # error: the assertion then runs as superuser, bypasses RLS and passes for
      # the wrong reason. ON_ERROR_STOP does not trip on a warning, so the log is
      # scanned for it. Four assertions were green this way until August 2026.
      - name: Apply schema and run assertions
        working-directory: docs/phase-0
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f 03b-verification.sql 2>&1 | tee "$RUNNER_TEMP/assertions.log"
          if grep -q 'SET LOCAL can only be used in transaction blocks' "$RUNNER_TEMP/assertions.log"; then
            echo "::error::Une assertion change de rôle hors transaction : elle s'exécute en superutilisateur et ne teste rien."
            exit 1
          fi

      # PostgreSQL accorde EXECUTE à PUBLIC sur toute fonction, et Supabase y
      # ajoute anon et authenticated. Les deux sont silencieux : le §8 de 0001
      # croyait exposer quatre fonctions, il y en avait neuf sur le projet réel.
      - name: Apply 0002 — function grants
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0002_function_grants.sql

      # Le test des droits d'appel ne tourne plus ici mais après 0005 : il
      # vérifie désormais aussi `owns_review()` et `comment_min_role()`, qui
      # n'existent qu'à partir de 0003 et 0004.

      # 0003 (carnet) et 0004 (commentaires + modération). Même scrutin du
      # journal que ci-dessus : un `SET LOCAL ROLE` hors transaction rend une
      # assertion RLS verte sans qu'elle teste quoi que ce soit.
      - name: Apply 0003 — carnet
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0003_carnet.sql

      - name: Apply 0004 — commentaires et modération
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0004_commentaires_moderation.sql

      - name: Carnet — portées et moyenne publique
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/03_carnet_rls.sql 2>&1 | tee "$RUNNER_TEMP/carnet.log"
          if grep -q 'SET LOCAL can only be used in transaction blocks' "$RUNNER_TEMP/carnet.log"; then
            echo "::error::Une assertion change de rôle hors transaction : elle ne teste rien."
            exit 1
          fi

      - name: Commentaires et modération
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/04_comments_moderation.sql 2>&1 | tee "$RUNNER_TEMP/moderation.log"
          if grep -q 'SET LOCAL can only be used in transaction blocks' "$RUNNER_TEMP/moderation.log"; then
            echo "::error::Une assertion change de rôle hors transaction : elle ne teste rien."
            exit 1
          fi

      # 0005 ferme dans `ref` et `mod` ce que 0002 n'avait fermé que dans
      # `public`. Après 0004, donc, puisqu'il vise aussi les fonctions de `mod`.
      - name: Apply 0005 — droits d'appel sur ref et mod
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0005_ref_function_grants.sql

      - name: Function grants, sur les trois schémas
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/02_function_grants.sql

      # 0006 ouvre la seule porte d'écriture vers `mod` — une fonction SECURITY
      # DEFINER dans `public`, accordée à la clé de service et à personne
      # d'autre. Son §3 (pg_cron) se déclare absent sur une base nue : c'est
      # attendu ici, et son auto-contrôle vérifie la planification partout où
      # l'extension existe.
      - name: Apply 0006 — signalement et statistiques
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/0006_signalement_et_statistiques.sql

      - name: Signalement DSA
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/05_signalement.sql 2>&1 | tee "$RUNNER_TEMP/signalement.log"
          if grep -q 'SET LOCAL can only be used in transaction blocks' "$RUNNER_TEMP/signalement.log"; then
            echo "::error::Une assertion change de rôle hors transaction : elle ne teste rien."
            exit 1
          fi

      # §0.5: a table without RLS breaks the build. Belt and braces — the
      # migration asserts this too, but a future migration might not.
      - name: RLS coverage
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/00_rls_coverage.sql

      # The seed runs on its own database: the verification file above inserts
      # fixtures that would otherwise collide with real seed rows.
      - name: Load the seed referential
        env:
          PGDATABASE: vitola_seed
        run: |
          createdb vitola_seed
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00_supabase_stubs.sql
          psql -v ON_ERROR_STOP=1 -f docs/phase-0/03-schema-p1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0002_function_grants.sql
          # 0003 pour public.aroma_taxonomy : depuis la roue des arômes, le seed
          # n'écrit plus seulement dans `ref`. Sans elle, la section 6 échoue sur
          # une table absente.
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/0003_carnet.sql
          cd supabase/seed && psql -v ON_ERROR_STOP=1 -f seed.sql

      - name: Seed integrity
        env:
          PGDATABASE: vitola_seed
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/01_seed_integrity.sql

      # Idempotence is not a nice-to-have: the seed will be re-run on every
      # correction to the CSVs, and it must never duplicate a row.
      - name: Seed is idempotent
        env:
          PGDATABASE: vitola_seed
        run: |
          before=$(psql -tAc "select count(*) from ref.cigars")
          before_aromas=$(psql -tAc "select count(*) from public.aroma_taxonomy")
          (cd supabase/seed && psql -v ON_ERROR_STOP=1 -f seed.sql > /dev/null)
          after=$(psql -tAc "select count(*) from ref.cigars")
          after_aromas=$(psql -tAc "select count(*) from public.aroma_taxonomy")
          if [ "$before" != "$after" ]; then
            echo "Le rejeu du seed a changé le nombre de fiches : $before -> $after"; exit 1
          fi
          if [ "$before_aromas" != "$after_aromas" ]; then
            echo "Le rejeu du seed a changé le nombre d'arômes : $before_aromas -> $after_aromas"; exit 1
          fi
          echo "Rejeu sans duplication : $after fiches, $after_aromas arômes"

      # The standalone file is derived. If a CSV changes and nobody regenerates
      # it, the dashboard path silently loads stale data.
      - name: Standalone seed is in sync with the CSVs
        run: |
          corepack enable
          pnpm install --frozen-lockfile --silent
          pnpm tsx tooling/scripts/build-standalone-seed.ts
          git diff --exit-code -- supabase/seed/seed_standalone.sql \
            || { echo "seed_standalone.sql est périmé : lancer pnpm tsx tooling/scripts/build-standalone-seed.ts"; exit 1; }

      - name: Seed paths must not reference third-party sources
        run: |
          # Scans the DATA only. PROVENANCE.md names those sites on purpose, to
          # record that they were not used — matching it would be backwards.
          if grep -niE 'halfwheel|cigaraficionado|cigardojo|cubancigarwebsite|scrape|crawler' \
               supabase/seed/*.csv supabase/seed/seed.sql; then
            echo "Une source tierce est referencee dans les donnees (§2 du brief, art. L341-1 CPI)."
            exit 1
          fi
          echo "Aucune source tierce referencee dans les donnees."
