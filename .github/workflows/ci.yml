name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: typecheck · lint · tokens · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Design-system guardrails: raw hex, raw palette utilities, emoji,
      # hard-coded brand name. See tooling/scripts/check-tokens.ts.
      - run: pnpm tokens:check
      - run: pnpm test

  build:
    name: build · storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          AGE_GATE_SECRET: ${{ secrets.AGE_GATE_SECRET || 'ci-only-secret-at-least-32-characters' }}
      # Storybook is the exit criterion of P0 (§9): if it stops building, the
      # design system has drifted from the code.
      - run: pnpm build-storybook

  e2e:
    name: e2e · age gate and health notice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          AGE_GATE_SECRET: ci-only-secret-at-least-32-characters
      - run: pnpm test:e2e
        env:
          AGE_GATE_SECRET: ci-only-secret-at-least-32-characters
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
