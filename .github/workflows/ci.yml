name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: typecheck · lint · tokens · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Design-system guardrails: raw hex, raw palette utilities, emoji,
      # hard-coded brand name. See tooling/scripts/check-tokens.ts.
      - run: pnpm tokens:check
      - run: pnpm test

  build:
    name: build · storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The referential pages are force-dynamic, so nothing here reaches the
      # database: these values only have to exist, because next.config.ts now
      # refuses to build without them. Same reasoning as the age gate secret
      # above — a guard that only fires in production fires at the visitor.
      - run: pnpm build
        env:
          AGE_GATE_SECRET: ${{ secrets.AGE_GATE_SECRET || 'ci-only-secret-at-least-32-characters' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
      # Storybook is the exit criterion of P0 (§9): if it stops building, the
      # design system has drifted from the code.
      #
      # It needs AGE_GATE_SECRET as much as `pnpm build` does: Storybook loads
      # next.config.ts through vite-plugin-storybook-nextjs, and that file now
      # refuses to evaluate without the secret. Passing it only to `pnpm build`
      # left this job red from fea4fc0 onwards.
      - run: pnpm build-storybook
        env:
          AGE_GATE_SECRET: ${{ secrets.AGE_GATE_SECRET || 'ci-only-secret-at-least-32-characters' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}

  e2e:
    name: e2e · age gate and health notice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          AGE_GATE_SECRET: ci-only-secret-at-least-32-characters
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - run: pnpm test:e2e
        env:
          AGE_GATE_SECRET: ci-only-secret-at-least-32-characters
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
